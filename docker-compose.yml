version: '3'

services:
  docradar:
    build: .
    image: docradar:latest
    container_name: docradar
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/db:/app/data/db
      - ./data/logs:/app/data/logs
      - ./users.json:/app/users.json
    environment:
      - SECRET_KEY=change_this_to_a_secure_random_string
      - ADMIN_KEY=change_this_to_a_secure_random_string
    command: gunicorn --workers=4 --bind 0.0.0.0:5000 app:app 